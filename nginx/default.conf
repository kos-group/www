# Sitio estático. TLS lo termina Traefik delante; aquí solo HTTP en el 8080 (imagen sin privilegios).
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;
    absolute_redirect off;
    charset utf-8;

    # Sonda de Kubernetes (llega por la IP del pod, no por el dominio).
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Dominio canónico: el apex redirige a www.
    if ($host = kosgroup.es) {
        return 301 https://www.kosgroup.es$request_uri;
    }

    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self'; script-src 'none'; object-src 'none'; base-uri 'self'; form-action 'none'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;
    add_header X-Frame-Options "DENY" always;

    # URL limpias: /aviso-legal -> aviso-legal.html
    location / {
        try_files $uri $uri.html $uri/ =404;
    }

    location ~* \.(css|svg|png)$ {
        expires 1h;
        add_header Cache-Control "public" always;
        add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self'; script-src 'none'; object-src 'none'; base-uri 'self'; form-action 'none'; frame-ancestors 'none'" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    error_page 404 /404.html;
}
